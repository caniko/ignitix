[package]
name = "ignitix-unlock-luks"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio"] }
libc = "0.2"
serde_json = "1"
tempfile = "3"
zeroize = "1"

[lints.rust]
unsafe_code = "deny"
