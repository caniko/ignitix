[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Installer media as flake modules"
description = "Consumers import the install-media flake-parts module and declare media in their own flake, so board image definitions stop being copied between infrastructure repositories."

[[pages.sections.features]]
title = "ROCKPro64 over one USB-C link"
description = "The bundled ROCKPro64 entry ships serial console visibility and USB-C gadget networking on a point-to-point 10.55.0.0/24 install link, so a board without a display can be installed."

[[pages.sections.features]]
title = "Install, mount, rescue and probe wrappers"
description = "Host-first install targets wrap nixos-anywhere for first install, mount, rescue and hardware probing, which keeps the invocation in the flake instead of in shell history."

[[pages.sections.features]]
title = "Bootstrap trust is verified"
description = "Setting nixosAnywhere.bootstrapHostKey resolves to an immutable known_hosts file with strict key checking and key-only authentication, shared by the install, probe and mount clients."

[[pages.sections]]
type = "install"
id = "install"
heading = "Quick start"
intro = "Add Ignitix as a flake input, import the install-media module, and build the bundled ROCKPro64 fixture image to see the catalog entry in action. The consuming flake supplies its own host metadata."
guide_href = "https://github.com/caniko/ignitix"

[[pages.sections.primary_routes]]
label = "Flake input"
audience = "An infrastructure flake that declares its own install media"
command = 'ignitix.url = "git+https://github.com/caniko/ignitix.git";'
href = "https://github.com/caniko/ignitix#quick-start"
recommended = true

[[pages.sections.secondary_routes]]
